name: Android V2 — Tests et APK
on:
  workflow_dispatch:
  push:
    paths: ['android-v2/**', 'tests/**', 'package*.json', '.github/workflows/android-v2.yml']
  pull_request:
    paths: ['android-v2/**', 'tests/**', 'package*.json', '.github/workflows/android-v2.yml']
concurrency:
  group: android-v2-${{ github.head_ref || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Vérifier le moteur, l’interface et les sauvegardes
        run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;34.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compiler et vérifier Android
        working-directory: android-v2
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon
      - name: Publier l’APK V2 et les rapports
        uses: actions/upload-artifact@v4
        with:
          name: Tournoi-Crozon-V2-APK
          if-no-files-found: error
          path: |
            android-v2/app/build/outputs/apk/debug/app-debug.apk
            android-v2/app/build/reports/lint-results-debug.html
