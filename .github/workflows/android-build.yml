name: Compiler APK Tournoi Crozon
on:
  workflow_dispatch:
  push:
    paths:
      - 'Projet_Android_Tournoi_Crozon_V3.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: 
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extraire le projet
        run: unzip -q Projet_Android_Tournoi_Crozon_V3.zip
      - name: Compiler l'APK
        working-directory: Tournoi_Crozon_Android_Projet
        run: gradle :app:assembleDebug --no-daemon
      - name: Rendre l'APK telechargeable
        uses: actions/upload-artifact@v4
        with:
          name: Tournoi-Crozon-APK
          path: Tournoi_Crozon_Android_Projet/app/build/outputs/apk/debug/app-debug.apk
