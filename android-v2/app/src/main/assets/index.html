</style><link rel="stylesheet" href="v2.css"></head><body><header><h1>🏸 Gestion du tournoi — Crozon</h1><p>Poules modifiables · Scores · Classements · Principal et consolante · Sauvegarde hors connexion</p></header><main><nav id="nav"></nav><div id="app"></div></main><script>
const DEFAULT={"pools": [{"id": "A", "name": "Poule A"}, {"id": "B", "name": "Poule B"}, {"id": "C", "name": "Poule C"}, {"id": "D", "name": "Poule D"}], "teams": [{"id": "A1", "pool": "A", "name": "Cédric (Crozon) / Angélique (Crozon)"}, {"id": "A2", "pool": "A", "name": "Gavin Mcmenemy / Maelle Gauthier"}, {"id": "A3", "pool": "A", "name": "Julio Ambrose (Scaër) / Mariame Dia (Scaër)"}, {"id": "A4", "pool": "A", "name": "Mikael (Telgruc) / Madeline (Telgruc)"}, {"id": "A5", "pool": "A", "name": "Stéphane Duong / Ho Thanh Thuy"}, {"id": "B1", "pool": "B", "name": "Charles Marant (Scaër) / Aurore Rober (Scaër)"}, {"id": "B2", "pool": "B", "name": "Franck (Crozon) / Maëwen (Crozon)"}, {"id": "B3", "pool": "B", "name": "Mathéo (Guipabad) / Salomé (Guipabad)"}, {"id": "B4", "pool": "B", "name": "Rémi (Plougonvin) / Camille (Plougonvin)"}, {"id": "C1", "pool": "C", "name": "Benjamin (Crozon) / Aéla (Crozon)"}, {"id": "C2", "pool": "C", "name": "Cyril Lecren / Leslie Ho"}, {"id": "C3", "pool": "C", "name": "David St-Yves (Scaër) / Cécilia Rober (Scaër)"}, {"id": "C4", "pool": "C", "name": "Yannick (Landeleau) / Lolita (Landeleau)"}, {"id": "D1", "pool": "D", "name": "Christopher (Crozon) / Mathilde (Plogonnec)"}, {"id": "D2", "pool": "D", "name": "Cédric (Ty Vougeret) / Emilie (Ty Vougeret)"}, {"id": "D3", "pool": "D", "name": "Louenn (Plougonvin) / Typhaine (Plougonvin)"}, {"id": "D4", "pool": "D", "name": "Tangi (Guipabad) / Enora (Guipabad)"}, {"id": "D5", "pool": "D", "name": "Erwan (Guipabad) / Maëlys (Guipabad)"}], "scores": {}, "brackets": {}, "settings": {"mainQualifiers": 2}};
const STORE='crozon-tournoi-v2-workspace';
let state;try{state=JSON.parse(localStorage.getItem(STORE))||JSON.parse(JSON.stringify(DEFAULT))}catch(e){state=JSON.parse(JSON.stringify(DEFAULT))}
let view='home',activePool=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
let save=()=>{try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){alert('Sauvegarde locale indisponible : exportez votre sauvegarde JSON.')}};
const poolTeams=p=>state.teams.filter(t=>t.pool===p);
const team=id=>state.teams.find(t=>t.id===id);
const name=id=>team(id)?.name||'—';
const pairKey=(a,b)=>[a,b].sort().join('|');
function schedule(ids){let pairs=[];for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)pairs.push([ids[i],ids[j]]);let result=[],last=[];while(pairs.length){let idx=pairs.findIndex(x=>x.every(z=>!last.includes(z)));if(idx<0)idx=pairs.findIndex(x=>!x.every(z=>last.includes(z)));if(idx<0)idx=0;let item=pairs.splice(idx,1)[0];result.push(item);last=item}return result}
function scoreStats(a,b){let vals=state.scores[pairKey(a,b)]||[];if(a!==pairKey(a,b).split('|')[0])vals=vals.map(v=>v?[v[1],v[0]]:v);let sa=0,sb=0,pa=0,pb=0,completed=0,invalid=false;for(let i=0;i<3;i++){let v=vals[i];if(!v||v[0]===''||v[1]===''||v[0]==null||v[1]==null)continue;let x=Number(v[0]),y=Number(v[1]);if(!Number.isFinite(x)||!Number.isFinite(y)||x===y||x<0||y<0){invalid=true;continue}completed++;pa+=x;pb+=y;if(x>y)sa++;else sb++}if((sa===2||sb===2)&&completed===sa+sb&&!invalid)return {done:true,sa,sb,pa,pb,winner:sa===2?a:b};return {done:false,sa,sb,pa,pb,invalid}}
function standings(p){let ts=poolTeams(p), rows=ts.map(t=>({id:t.id,name:t.name,m:0,w:0,l:0,sg:0,sp:0,pm:0,pe:0})), map=Object.fromEntries(rows.map(r=>[r.id,r]));for(let i=0;i<ts.length;i++)for(let j=i+1;j<ts.length;j++){let a=ts[i].id,b=ts[j].id,s=scoreStats(a,b);if(!s.done)continue;let ra=map[a],rb=map[b];ra.m++;rb.m++;ra.sg+=s.sa;ra.sp+=s.sb;rb.sg+=s.sb;rb.sp+=s.sa;ra.pm+=s.pa;ra.pe+=s.pb;rb.pm+=s.pb;rb.pe+=s.pa;map[s.winner].w++;map[s.winner===a?b:a].l++}for(let r of rows){r.ds=r.sg-r.sp;r.dp=r.pm-r.pe}rows.sort((a,b)=>b.w-a.w||b.ds-a.ds||b.dp-a.dp||a.name.localeCompare(b.name));let groups=[];for(let r of rows){let g=groups.find(g=>g[0].w===r.w);if(g)g.push(r);else groups.push([r])}let ordered=[];for(let g of groups){if(g.length===2){let s=scoreStats(g[0].id,g[1].id);if(s.done&&s.winner===g[1].id)g.reverse()}else if(g.length>2){g.sort((a,b)=>b.ds-a.ds||b.dp-a.dp||a.name.localeCompare(b.name));let i=0;while(i<g.length){let j=i+1;while(j<g.length&&g[i].ds===g[j].ds&&g[i].dp===g[j].dp)j++;if(j-i===2){let s=scoreStats(g[i].id,g[i+1].id);if(s.done&&s.winner===g[i+1].id)[g[i],g[i+1]]=[g[i+1],g[i]]}i=j}}ordered.push(...g)}return ordered}
function completedPool(p){let ts=poolTeams(p);return ts.length>=2&&ts.every((t,i)=>ts.slice(i+1).every(u=>scoreStats(t.id,u.id).done))}
function render(){const tabs=[['home','⌂','Accueil'],['teams','♧','Équipes & poules'],['matches','▦','Rencontres'],['standings','▥','Classements'],['finals','🏆','Phases finales'],['backup','⇩','Sauvegardes']];$('nav').innerHTML=tabs.map(([v,ico,l])=>`<button class="${view===v?'selected':''}" onclick="go('${v}')"><span class="navicon">${ico}</span><span>${l}</span></button>`).join('');({home:renderHome,teams:renderTeams,matches:renderMatches,standings:renderStandings,finals:renderFinals,backup:renderBackup}[view])()}
function renderHome(){let count=state.teams.length,total=0,done=0;for(let p of state.pools){let ts=poolTeams(p.id);total+=ts.length*(ts.length-1)/2;for(let i=0;i<ts.length;i++)for(let j=i+1;j<ts.length;j++)if(scoreStats(ts[i].id,ts[j].id).done)done++}let percent=total?Math.round(done/total*100):0;$('app').innerHTML=`<section class="hero"><div class="eyebrow">PRESQU'ÎLE CROZON BADMINTON</div><h2>Votre tournoi,<br><em>en un seul endroit.</em></h2><p>Préparez les poules, saisissez les scores et suivez les phases finales, même hors connexion.</p><button class="heroaction" onclick="go('matches')">Saisir les résultats <span>→</span></button><div class="courtline"></div></section><div class="stats"><div class="stat"><strong>${count}</strong><span>Équipes</span></div><div class="stat"><strong>${state.pools.length}</strong><span>Poules</span></div><div class="stat"><strong>${done}<small> / ${total}</small></strong><span>Matchs joués</span></div><div class="stat"><strong>${percent}%</strong><span>Progression</span></div></div><section class="card"><div class="sectionhead"><div><div class="eyebrow dark">ACCÈS RAPIDE</div><h2>Que souhaitez-vous faire ?</h2></div></div><div class="quickgrid"><button class="quick" onclick="go('teams')"><span class="quickicon">♧</span><strong>Gérer les équipes</strong><small>Ajouter, modifier, répartir les poules</small><span class="arrow">↗</span></button><button class="quick" onclick="go('matches')"><span class="quickicon">▦</span><strong>Saisir un score</strong><small>Rencontres et sets à 21 points</small><span class="arrow">↗</span></button><button class="quick" onclick="go('standings')"><span class="quickicon">▥</span><strong>Voir les classements</strong><small>Victoires, sets et points</small><span class="arrow">↗</span></button><button class="quick" onclick="go('finals')"><span class="quickicon">🏆</span><strong>Phases finales</strong><small>Tableau principal et consolante</small><span class="arrow">↗</span></button></div></section><section class="card"><div class="sectionhead"><h2>État des poules</h2><button onclick="go('standings')">Classements →</button></div><div class="poolgrid">${state.pools.map(p=>{let ts=poolTeams(p.id),n=ts.length*(ts.length-1)/2,d=0;for(let i=0;i<ts.length;i++)for(let j=i+1;j<ts.length;j++)if(scoreStats(ts[i].id,ts[j].id).done)d++;return `<div class="poolmini"><div class="poolletter">${esc(p.id)}</div><div><strong>${esc(p.name)}</strong><small>${ts.length} équipes · ${d}/${n} matchs</small></div><div class="minibar"><span style="width:${n?d/n*100:0}%"></span></div></div>`}).join('')}</div></section>`}

function go(v){view=v;render()}
function renderTeams(){let html=`<section class="card"><h2>Équipes et poules</h2><p class="muted">Ajoutez des équipes, modifiez leurs noms ou changez-les de poule. Les rencontres sont générées automatiquement. Les scores restent liés aux équipes, même si elles changent de poule.</p><div class="actions actiontiles"><button class="primary" onclick="addTeam()">＋ Ajouter une équipe</button><button onclick="addPool()">⊞ Créer une poule</button><button onclick="openImport()">⇧ Importer une liste</button></div><div class="notice warn">Si vous modifiez les poules après avoir saisi des résultats, les anciens scores entre équipes déplacées ne compteront plus dans leur nouvelle poule. Vérifiez les rencontres avant de continuer.</div></section>`;for(let p of state.pools){let ts=poolTeams(p.id);html+=`<section class="card"><div class="flex"><h2 style="margin:0">${esc(p.name)} (${ts.length} équipes)</h2><button class="danger no-print" onclick="removePool('${p.id}')">Supprimer la poule</button></div>`;for(let t of ts)html+=`<div class="flex" style="padding:8px 0;border-bottom:1px solid #edf0f4"><span class="small" style="width:28px">${esc(t.id)}</span><input class="teamname" aria-label="Nom équipe" value="${esc(t.name)}" onchange="renameTeam('${t.id}',this.value)"><select aria-label="Changer de poule" onchange="moveTeam('${t.id}',this.value)">${state.pools.map(q=>`<option value="${q.id}" ${q.id===p.id?'selected':''}>${esc(q.name)}</option>`).join('')}</select><button class="danger no-print" onclick="removeTeam('${t.id}')">✕</button></div>`;html+='</section>'} $('app').innerHTML=html}
function openImport(){let html=`<section class="card"><div class="eyebrow dark">IMPORTATION</div><h2>Importer plusieurs équipes</h2><p class="muted">Une équipe par ligne. Format : <b>Joueur 1 / Joueur 2 ; Poule</b> (exemple : Alice / Bob ; A). La poule est facultative : sans indication, l'équipe va dans la première poule.</p><textarea id="bulkTeams" rows="9" placeholder="Alice (Crozon) / Bob (Crozon) ; A&#10;Chloé / David ; B"></textarea><div class="actions"><button class="primary" onclick="importTeams()">Importer les équipes</button><button onclick="go('teams')">Annuler</button></div><p class="muted small">Les doublons de noms sont ignorés. Les nouvelles poules sont créées si nécessaire.</p></section>`;$('app').innerHTML=html}
function importTeams(){let raw=$('bulkTeams').value,lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),added=0,skipped=0;for(let line of lines){let parts=line.split(';'),n=parts[0].trim(),pool=(parts[1]||state.pools[0]?.id||'A').trim().toUpperCase().replace(/^POULE\s+/,'');if(!/^[A-Z0-9_-]+$/.test(pool)){skipped++;continue}if(!n||state.teams.some(t=>t.name.toLowerCase()===n.toLowerCase())){skipped++;continue}if(!state.pools.some(p=>p.id===pool))state.pools.push({id:pool,name:'Poule '+pool});state.teams.push({id:uid(),pool,name:n});added++}state.brackets={};save();alert(`${added} équipe(s) importée(s), ${skipped} ignorée(s).`);go('teams')}
function addPool(){let suggested='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').find(x=>!state.pools.some(p=>p.id===x))||uid();let title=prompt('Nom de la nouvelle poule :','Poule '+suggested);if(!title?.trim())return;let id=uid();state.pools.push({id,name:title.trim()});save();render()}
function removePool(id){let p=state.pools.find(p=>p.id===id);if(!p||!confirm(`Supprimer ${p.name} et ses ${poolTeams(id).length} équipes ?`))return;let ids=new Set(poolTeams(id).map(t=>t.id));state.teams=state.teams.filter(t=>!ids.has(t.id));state.pools=state.pools.filter(p=>p.id!==id);state.brackets={};save();render()}
function addTeam(){if(!state.pools.length){alert('Créez d’abord une poule.');return}let n=prompt('Nom des deux joueurs (et club) :','');if(!n?.trim())return;let p=prompt('Dans quelle poule ? '+state.pools.map((x,i)=>`${i+1}=${x.name}`).join(', '),'1');let ix=Number(p)-1;if(!state.pools[ix]){alert('Poule invalide');return}state.teams.push({id:uid(),name:n.trim(),pool:state.pools[ix].id});state.brackets={};save();render()}
function renameTeam(id,v){if(!v.trim()){alert('Nom obligatoire');render();return}team(id).name=v.trim();save();render()}
function moveTeam(id,p){team(id).pool=p;state.brackets={};save();render()}
function removeTeam(id){if(!confirm(`Supprimer ${name(id)} ?`))return;state.teams=state.teams.filter(t=>t.id!==id);state.brackets={};save();render()}
function renderMatches(){let html='<section class="card"><h2>Rencontres de poules</h2><p>Renseignez les points de chaque set. Un match est validé dès qu’une équipe remporte deux sets. Laissez le troisième set vide pour une victoire 2–0.</p></section>';for(let p of state.pools){let ts=poolTeams(p.id),pairs=schedule(ts.map(t=>t.id)),done=pairs.filter(([a,b])=>scoreStats(a,b).done).length;html+=`<section class="card"><h2>${esc(p.name)} — ${done}/${pairs.length} matchs terminés</h2>`;pairs.forEach(([a,b],i)=>{let vals=state.scores[pairKey(a,b)]||[];if(a!==pairKey(a,b).split('|')[0])vals=vals.map(v=>v?[v[1],v[0]]:v);let s=scoreStats(a,b);html+=`<div class="match"><div class="matchhead"><span>Match ${i+1} : ${esc(name(a))} <span class="muted">contre</span> ${esc(name(b))}</span><span class="${s.done?'pill':'status'}">${s.done?'✓ '+esc(name(s.winner)):(s.invalid?'Score invalide':'À jouer')}</span></div><div class="sets">`;for(let j=0;j<3;j++){let v=vals[j]||['',''];html+=`<div class="set"><span>Set ${j+1}</span><input type="number" min="0" max="99" aria-label="${esc(name(a))} set ${j+1}" value="${esc(v[0])}" onchange="setScore('${a}','${b}',${j},0,this.value)"><span>–</span><input type="number" min="0" max="99" aria-label="${esc(name(b))} set ${j+1}" value="${esc(v[1])}" onchange="setScore('${a}','${b}',${j},1,this.value)"></div>`}html+='</div></div>'});html+='</section>'}$('app').innerHTML=html}
function setScore(a,b,i,side,v){let key=pairKey(a,b);let vals=state.scores[key]||[['',''],['',''],['','']];while(vals.length<3)vals.push(['','']);let idx=a===key.split('|')[0]?side:1-side;vals[i][idx]=v;state.scores[key]=vals;state.brackets={};save();render()}
function renderStandings(){let html='<section class="card"><h2>Classements</h2><p>Victoires d’abord ; confrontation directe entre deux équipes à égalité ; puis différence de sets et de points pour les égalités multiples. Les égalités complexes peuvent nécessiter une vérification manuelle selon le règlement officiel.</p></section>';for(let p of state.pools){let rows=standings(p.id),done=completedPool(p.id);html+=`<section class="card"><h2>${esc(p.name)} ${done?'<span class="pill">Poule terminée</span>':'<span class="status">En cours</span>'}</h2><div class="tablewrap"><table><thead><tr><th>Équipe</th><th>MJ</th><th>V</th><th>D</th><th>SG</th><th>SP</th><th>Diff. sets</th><th>PM</th><th>PE</th><th>Diff. pts</th><th>Tableau</th></tr></thead><tbody>`;rows.forEach((r,i)=>html+=`<tr><td>${i+1}. ${esc(r.name)}</td><td>${r.m}</td><td>${r.w}</td><td>${r.l}</td><td>${r.sg}</td><td>${r.sp}</td><td>${r.ds>0?'+':''}${r.ds}</td><td>${r.pm}</td><td>${r.pe}</td><td>${r.dp>0?'+':''}${r.dp}</td><td>${i<2?'Principal':'Consolante'}</td></tr>`);html+='</tbody></table></div></section>'}$('app').innerHTML=html}
function qualifiers(){let main=[],consol=[];for(let p of state.pools){let rows=standings(p.id);rows.forEach((r,i)=>(i<2?main:consol).push({id:r.id,pool:p.id,rank:i+1}))}return {main,consol}}
function bracketSize(n){let size=2;while(size<n)size*=2;return size}
function seedSlots(n){let size=bracketSize(n),s=[1,2];while(s.length<size){let total=s.length*2+1;s=s.flatMap(x=>[x,total-x])}return s}
function bracketBuild(type){let participants=qualifiers()[type];if(!participants.length)return {rounds:[],signature:''};let signature=participants.map(x=>x.id+':'+x.rank).join('|');let old=state.brackets[type];if(old?.signature===signature)return old;let size=bracketSize(participants.length);let sorted=[...participants].sort((a,b)=>a.rank-b.rank||a.pool.localeCompare(b.pool));let slots=seedSlots(participants.length).map(s=>sorted[s-1]?.id||null);let rounds=[];rounds.push(Array.from({length:size/2},(_,i)=>({a:slots[i*2],b:slots[i*2+1],winner:null})));let n=size/4;while(n>=1){rounds.push(Array.from({length:n},()=>({a:null,b:null,winner:null})));n=Math.floor(n/2)}let out={signature,rounds};state.brackets[type]=out;save();return out}
function propagate(br){for(let r=0;r<br.rounds.length;r++){let matches=br.rounds[r];for(let i=0;i<matches.length;i++){let m=matches[i];if(r>0){let left=br.rounds[r-1][i*2],right=br.rounds[r-1][i*2+1];m.a=left.winner;m.b=right.winner}if(m.a&&!m.b){let prevRound=r===0;let otherPending=r>0&&(!br.rounds[r-1][i*2+(m.a===br.rounds[r-1][i*2].winner?1:0)].winner);m.winner=prevRound||!otherPending?m.a:null}else if(!m.a&&m.b){let prevRound=r===0;let otherPending=r>0&&(!br.rounds[r-1][i*2+(m.b===br.rounds[r-1][i*2].winner?1:0)].winner);m.winner=prevRound||!otherPending?m.b:null}else if(!m.a&&!m.b)m.winner=null;else if(m.winner!==m.a&&m.winner!==m.b)m.winner=null}}}
function bracketWinner(type,r,i,id){let b=state.brackets[type];let m=b.rounds[r][i];m.winner=id||null;for(let k=r+1;k<b.rounds.length;k++)for(let x of b.rounds[k])x.winner=null;propagate(b);save();render()}
function swapSeed(type,index,side,id){let b=state.brackets[type],m=b.rounds[0][index];m[side]=id||null;for(let r of b.rounds)for(let x of r)x.winner=null;propagate(b);save();render()}
function renderFinals(){let q=qualifiers();let allDone=state.pools.every(p=>completedPool(p.id));let html=`<section class="card"><h2>Phases finales</h2><div class="notice ${allDone?'':'warn'}">${allDone?'Toutes les poules sont terminées.':'Attention : certaines poules sont encore en cours. Les qualifiés sont provisoires et peuvent changer.'} Les deux premiers de chaque poule vont en tableau principal, tous les autres en consolante. Les exemptions (BYE) sont automatiques.</div><p>Pour modifier une affiche, changez les équipes du premier tour. Pour chaque match, choisissez le vainqueur : il passe automatiquement au tour suivant.</p><div class="actions"><button onclick="print()">🖨️ Imprimer les tableaux</button><button class="danger" onclick="resetBrackets()">Réinitialiser les tableaux</button></div></section>`;for(let type of ['main','consol']){let b=bracketBuild(type);propagate(b);let entrants=q[type];html+=`<section class="card"><h2>${type==='main'?'Tableau principal':'Consolante'} — ${entrants.length} équipes</h2><div class="bracket">`;b.rounds.forEach((round,r)=>{let label=r===b.rounds.length-1?'Finale':r===b.rounds.length-2?'Demi-finales':r===b.rounds.length-3?'Quarts de finale':r===b.rounds.length-4?'Huitièmes de finale':r===b.rounds.length-5?'Seizièmes de finale':'Tour '+(r+1);html+=`<div class="round"><h3>${label}</h3>`;round.forEach((m,i)=>{html+=`<div class="tie"><div class="small">Match ${i+1}</div>`;for(let side of ['a','b']){if(r===0){html+=`<select aria-label="Équipe ${side}" onchange="swapSeed('${type}',${i},'${side}',this.value)"><option value="">— Exempt —</option>${entrants.map(t=>`<option value="${t.id}" ${m[side]===t.id?'selected':''}>${esc(name(t.id))}</option>`).join('')}</select>`}else html+=`<div style="padding:7px 0">${esc(name(m[side]))}</div>`}if(m.a&&m.b)html+=`<select aria-label="Vainqueur" onchange="bracketWinner('${type}',${r},${i},this.value)"><option value="">Choisir le vainqueur</option><option value="${m.a}" ${m.winner===m.a?'selected':''}>${esc(name(m.a))}</option><option value="${m.b}" ${m.winner===m.b?'selected':''}>${esc(name(m.b))}</option></select>`;else html+=`<div class="status">${m.winner?'Exempt → '+esc(name(m.winner)):'En attente'}</div>`;html+='</div>'});html+='</div>'});html+='</div></section>'}$('app').innerHTML=html}
function resetBrackets(){if(confirm('Réinitialiser les deux tableaux et leurs vainqueurs ?')){state.brackets={};save();render()}}
function download(content,filename,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function backup(){download(JSON.stringify(state,null,2),'sauvegarde-tournoi-crozon.json','application/json')}
function csv(){let rows=[['Poule','Rang','Équipe','MJ','V','D','SG','SP','Diff sets','PM','PE','Diff points']];for(let p of state.pools)standings(p.id).forEach((r,i)=>rows.push([p.name,i+1,r.name,r.m,r.w,r.l,r.sg,r.sp,r.ds,r.pm,r.pe,r.dp]));download('\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n'),'classements-tournoi.csv','text/csv;charset=utf-8')}
function restore(file){if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!Array.isArray(data.pools)||!Array.isArray(data.teams)||typeof data.scores!=='object')throw Error('Format incorrect');if(!confirm('Remplacer les données actuelles par cette sauvegarde ?'))return;state=data;state.brackets||={};save();render();alert('Sauvegarde restaurée')}catch(e){alert('Fichier de sauvegarde invalide : '+e.message)}};reader.readAsText(file)}
function renderBackup(){$('app').innerHTML=`<section class="card"><h2>Sauvegardes et export</h2><p>Les données sont enregistrées automatiquement dans ce navigateur, sur cet appareil. Pour transférer le tournoi sur un autre appareil ou éviter une perte, exportez régulièrement une sauvegarde JSON.</p><div class="actions"><button class="primary" onclick="backup()">⬇ Sauvegarder tout (JSON)</button><button onclick="csv()">⬇ Exporter les classements (CSV)</button><label class="filelabel">⬆ Restaurer une sauvegarde <input id="importfile" type="file" accept=".json,application/json" onchange="restore(this.files[0])"></label><button onclick="print()">🖨️ Imprimer la page</button></div><div class="notice warn">Les données ne sont pas synchronisées entre téléphones. N'utilisez qu'un appareil principal pour saisir les résultats, puis faites une sauvegarde JSON régulière.</div><div class="actions"><button class="danger" onclick="resetAll()">Repartir des 18 équipes initiales</button></div></section>`}
function resetAll(){if(confirm('Effacer tous les scores, les équipes ajoutées et les tableaux ?')){state=JSON.parse(JSON.stringify(DEFAULT));save();render()}}

</script><script src="v2.js"></script><script src="pool-print.js"></script><script src="sport-ui.js"></script><script>
window.addEventListener('DOMContentLoaded',()=>{if(window.AndroidExport){window.print=function(){AndroidExport.printPage();};window.download=function(content,filename,type){AndroidExport.saveFile(String(content),String(filename),String(type));};}});
</script></body></html>
